<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- FocusPot: 고양이 귀가 달린 화분 + 집중하며 자라는 새싹 -->

  <!-- 새싹 -->
  <path d="M60 44 C60 36 60 30 60 24" stroke="#4E9160" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M60 30 C52 30 44 25 42 16 C51 15 59 20 60 30 Z" fill="#6FAF7B"/>
  <path d="M60 25 C66 25 74 21 77 12 C68 11 61 16 60 25 Z" fill="#8CC497"/>

  <!-- 귀 -->
  <path d="M27 46 L31 27 L45 41 Z" fill="#E35F35" stroke="#E35F35" stroke-width="5" stroke-linejoin="round"/>
  <path d="M93 46 L89 27 L75 41 Z" fill="#E35F35" stroke="#E35F35" stroke-width="5" stroke-linejoin="round"/>
  <path d="M31.5 37 L33 31 L38 36 Z" fill="#FFB59A" stroke="#FFB59A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M88.5 37 L87 31 L82 36 Z" fill="#FFB59A" stroke="#FFB59A" stroke-width="2" stroke-linejoin="round"/>

  <!-- 화분 몸통 -->
  <path d="M27 54 H93 L86.5 98 Q85 107 76 107 H44 Q35 107 33.5 98 Z" fill="#F2784B"/>
  <path d="M33 60 H41 L37.5 92 Q37 96 35 92 Z" fill="#FFFFFF" opacity="0.18"/>

  <!-- 화분 테두리 -->
  <rect x="19" y="42" width="82" height="17" rx="8.5" fill="#E35F35"/>

  <!-- 얼굴: 집중해서 감은 눈 -->
  <path d="M43 75 Q48 80 53 75" stroke="#3A2A20" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M67 75 Q72 80 77 75" stroke="#3A2A20" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M55 84 Q57.5 87 60 84 Q62.5 87 65 84" stroke="#3A2A20" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <ellipse cx="41" cy="84" rx="5" ry="3" fill="#FFB59A" opacity="0.9"/>
  <ellipse cx="79" cy="84" rx="5" ry="3" fill="#FFB59A" opacity="0.9"/>
</svg>
